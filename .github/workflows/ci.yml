name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed advisory in a dependency surfaces even when
    # nothing has been pushed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Third-party actions are pinned to a commit SHA rather than a tag: a tag
      # can be moved to point at different code, a SHA cannot.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's token in .git/config for later steps to read.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      # The floor counts the Streamlit dashboard, which was previously excluded
      # from measurement. Its upload-driven paths cannot be driven by Streamlit's
      # AppTest harness, so including it lowers the headline number while making
      # it honest - untested code is now counted rather than hidden.
      - name: Test with coverage
        run: pytest --cov=src/dqms --cov-report=term-missing --cov-fail-under=80

      - name: Smoke test the CLI end to end
        run: |
          dqms --version
          dqms profile data/samples/customers.csv
          dqms analyze data/samples/customers.csv --no-report
          dqms report data/samples/customers.csv -o "${RUNNER_TEMP}/report" -f html -f summary
          test -f "${RUNNER_TEMP}/report/customers_report.html"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built with the runner's own Docker rather than a third-party action:
      # this needs no extra trust in the supply chain, and the image is never
      # pushed anywhere.
      - name: Build the image
        run: docker build --tag dqms:ci .

      - name: Verify the image runs, and runs unprivileged
        run: |
          test "$(docker run --rm --entrypoint id dqms:ci -u)" != "0"
          docker run --rm dqms:ci --version
          mkdir -p sample out
          cp data/samples/customers.csv sample/
          docker run --rm \
            -v "$PWD/sample:/data:ro" \
            -v "$PWD/out:/output" \
            --user "$(id -u):$(id -g)" \
            dqms:ci analyze /data/customers.csv --no-record
        env:
          DOCKER_BUILDKIT: 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The declared requirement sets are audited rather than the installed
      # environment: what matters is what this project asks for, and auditing an
      # environment would also trip over the package itself, which is installed
      # from the checkout because no release has been uploaded to an index yet.
      - name: Audit declared dependencies for known advisories
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off
          pip-audit -r requirements-dev.txt --strict --progress-spinner off

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Credential shapes, not the word "password": the tests legitimately carry
      # fake webhook URLs to prove the redactor masks them. Dependency-free on
      # purpose - a secret scanner is the last place to add a supply chain.
      - name: Secret scan (nothing credential-shaped in the tree)
        run: |
          set -euo pipefail
          patterns='AKIA[0-9A-Z]{16}'
          patterns="$patterns"'|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          patterns="$patterns"'|gh[pousr]_[A-Za-z0-9]{36}'
          patterns="$patterns"'|xox[abprs]-[0-9A-Za-z-]{10,}'
          patterns="$patterns"'|sk_live_[0-9A-Za-z]{16,}'
          patterns="$patterns"'|AIza[0-9A-Za-z_-]{35}'
          patterns="$patterns"'|hooks\.slack\.com/services/[A-Za-z0-9_/-]{20,}'
          if git grep -nIE "$patterns" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A committed value looks like a live credential"
            exit 1
          fi
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked - secrets belong in the environment"
            exit 1
          fi
          echo "No credential-shaped values are committed."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r src --severity-level medium
